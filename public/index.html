<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Can Collage Converter</title>
<style>
:root{--bg:#f6f6f4;--fg:#1a1a1a;--card:#fff;--line:#d9d9d4;--acc:#c8102e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#eee;--card:#222;--line:#3a3a3a;--acc:#ff4d63;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--fg:#eee;--card:#222;--line:#3a3a3a;--acc:#ff4d63;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 16px;opacity:.7}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.slot{background:var(--card);border:1.5px dashed var(--line);border-radius:10px;padding:10px;text-align:center;cursor:pointer;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.slot.has{border-style:solid}
.slot b{font-size:13px}.slot small{opacity:.6}
.slot canvas{max-width:100%;max-height:100px;background:#fff;border-radius:4px}
.slot input{display:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
input[type=url],input[type=text]{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);flex:1;min-width:200px}
select,button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.4}
#status{font-size:13px;opacity:.75;min-height:18px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.th{display:none;margin:0;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--bg)}
.th.ready{display:block}
.only .th[data-bad="1"]{display:none}
.th img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:4px;display:block}
.th .meta{font-size:11px;opacity:.65;margin:4px 0;display:flex;justify-content:space-between}
.th .tag{color:var(--acc);font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.btns button{padding:5px 0;font-size:12px}
.out{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:720px){.out{grid-template-columns:2fr 1fr}}
.out figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.out canvas{width:100%;height:auto;display:block;background:#fff}
figcaption{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
</style>
</head>
<body>
<main>
<h1>Can Collage Converter</h1>
<p class="sub">Load photos from a page link or from files, then download the collage and the main card.</p>

<div class="box">
  <b>Load from a web page</b>
  <div class="row">
    <input id="url" type="url" placeholder="Paste the link to the page with the can">
    <button class="primary" id="scan">Find photos</button>
  </div>
  <div id="status"></div>
  <div class="row">
    <label><input type="checkbox" id="onlycan" checked> Only can-like photos (hides small images, banners, logos)</label>
    <button id="auto" disabled>Auto-fill from first photos</button>
  </div>
  <div id="thumbs" class="thumbs only"></div>
</div>

<div class="slots" id="slots"></div>

<div class="row">
  <label>Format <select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></label>
  <label>Margin <select id="mar"><option value="0.03">Small</option><option value="0.05" selected>Normal</option><option value="0.08">Large</option></select></label>
  <label>Background cut <input id="tol" type="range" min="0" max="90" value="34" style="vertical-align:middle;width:110px"></label>
  <label>File name <input id="name" type="text" value="can" style="flex:none;min-width:0;width:120px"></label>
  <button class="primary" id="both" disabled>Download both</button>
</div>

<div class="out">
  <figure><canvas id="collage" width="1232" height="750"></canvas>
    <figcaption><span>Collage</span><button id="dl1" disabled>Download</button></figcaption></figure>
  <figure><canvas id="card" width="400" height="600"></canvas>
    <figcaption><span>Main card 2:3</span><button id="dl2" disabled>Download</button></figcaption></figure>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const SLOTS=[["main","Main side",true],["second","Second side",false],["back","Back",false],["top","Top",false]];
const KEYS=SLOTS.map(s=>s[0]);
const LABEL={main:"Main",second:"2nd",back:"Back",top:"Top"};
const BADURL=/logo|icon|sprite|avatar|banner|flag|button|placeholder|loading|social|payment|badge/i;
const imgs={},slotEls={};

// Collage geometry (3 tall cells + 2 squares on the right)
const W=2464,H=1500,B=20;
const SQ=(H-3*B)/2, TALL=(W-5*B-SQ)/3;

SLOTS.forEach(([k,label,req])=>{
  const d=document.createElement("label");d.className="slot";
  d.innerHTML=`<b>${label}</b><small>${req?"required":"optional"}</small><span class="pv">Tap to choose a file</span><input type="file" accept="image/*">`;
  d.querySelector("input").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const im=new Image();im.onload=()=>setImage(k,im);im.src=URL.createObjectURL(f);
  };
  $("slots").appendChild(d);slotEls[k]=d;
});

const tol=()=>+$("tol").value;
function setImage(k,src){
  imgs[k]={src,img:cleanImage(src,tol())};
  showSlot(k);tagThumbs();render();
}
function showSlot(k){
  const el=slotEls[k],pv=el.querySelector(".pv");
  el.classList.add("has");pv.innerHTML="";pv.appendChild(mini(imgs[k].img));
}
function mini(c){
  const s=Math.min(1,200/c.height,200/c.width);
  const m=document.createElement("canvas");
  m.width=Math.max(1,Math.round(c.width*s));m.height=Math.max(1,Math.round(c.height*s));
  m.getContext("2d").drawImage(c,0,0,m.width,m.height);return m;
}
let tolTimer;
$("tol").oninput=()=>{
  clearTimeout(tolTimer);
  tolTimer=setTimeout(()=>{
    KEYS.forEach(k=>{if(imgs[k]){imgs[k].img=cleanImage(imgs[k].src,tol());showSlot(k)}});
    render();
  },150);
};

// Remove the background (flood fill from the edges), make it pure white, crop to the can
function cleanImage(src,tolerance){
  let w=src.naturalWidth,h=src.naturalHeight;
  const sc=Math.min(1,3000/Math.max(w,h));
  w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d",{willReadFrequently:true});
  x.fillStyle="#fff";x.fillRect(0,0,w,h);
  x.drawImage(src,0,0,w,h);
  const id=x.getImageData(0,0,w,h),d=id.data;
  const rs=[],gs=[],bs=[];
  const smp=(px,py)=>{const i=(py*w+px)*4;rs.push(d[i]);gs.push(d[i+1]);bs.push(d[i+2]);};
  const sx=Math.max(1,w>>6),sy=Math.max(1,h>>6);
  for(let i=0;i<w;i+=sx){smp(i,0);smp(i,h-1)}
  for(let j=0;j<h;j+=sy){smp(0,j);smp(w-1,j)}
  const med=a=>a.sort((p,q)=>p-q)[a.length>>1];
  const br=med(rs),bg=med(gs),bb=med(bs);
  const isBg=p=>{const i=p*4;return Math.abs(d[i]-br)<=tolerance&&Math.abs(d[i+1]-bg)<=tolerance&&Math.abs(d[i+2]-bb)<=tolerance};
  const seen=new Uint8Array(w*h),stack=new Int32Array(w*h);let sp=0;
  const push=p=>{if(!seen[p]&&isBg(p)){seen[p]=1;stack[sp++]=p}};
  for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}
  for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
  while(sp){
    const p=stack[--sp],px=p%w,py=(p-px)/w;
    if(px>0)push(p-1);if(px<w-1)push(p+1);if(py>0)push(p-w);if(py<h-1)push(p+w);
  }
  const rc=new Uint32Array(h),cc=new Uint32Array(w);
  for(let p=0;p<w*h;p++){
    if(seen[p]){const i=p*4;d[i]=d[i+1]=d[i+2]=255;d[i+3]=255}
    else{const px=p%w;rc[(p-px)/w]++;cc[px]++}
  }
  x.putImageData(id,0,0);
  const mc=Math.max(2,Math.round(Math.max(w,h)*0.002));
  let x0=0,x1=w-1,y0=0,y1=h-1;
  while(x0<w&&cc[x0]<mc)x0++;while(x1>x0&&cc[x1]<mc)x1--;
  while(y0<h&&rc[y0]<mc)y0++;while(y1>y0&&rc[y1]<mc)y1--;
  if(x0>=x1||y0>=y1)return c;
  const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;
  o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o;
}

function place(ctx,item,x,y,w,h,m){
  const c=item.img;
  const s=Math.min(w*(1-2*m)/c.width,h*(1-2*m)/c.height);
  const dw=c.width*s,dh=c.height*s;
  ctx.drawImage(c,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
}

function render(){
  const m=parseFloat($("mar").value)*0.6;
  const c=$("collage");c.width=W;c.height=H;
  const g=c.getContext("2d");g.imageSmoothingQuality="high";
  g.fillStyle="#000";g.fillRect(0,0,W,H);g.fillStyle="#fff";
  const cells=[];
  for(let i=0;i<3;i++)cells.push([B+i*(TALL+B),B,TALL,H-2*B]);
  const rx=B+3*(TALL+B);
  cells.push([rx,B,SQ,SQ]);cells.push([rx,2*B+SQ,SQ,SQ]);
  cells.forEach(r=>g.fillRect(...r));
  ["main","second","back"].forEach((k,i)=>{if(imgs[k])place(g,imgs[k],...cells[i],m)});
  if(imgs.top)place(g,imgs.top,...cells[4],m);

  const k=$("card");k.width=1600;k.height=2400;
  const h=k.getContext("2d");h.imageSmoothingQuality="high";
  h.fillStyle="#fff";h.fillRect(0,0,1600,2400);
  if(imgs.main)place(h,imgs.main,0,0,1600,2400,m);
  const ok=!!imgs.main;
  ["dl1","dl2","both"].forEach(i=>$(i).disabled=!ok);
}

function save(canvas,suffix){
  const type=$("fmt").value,ext={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"}[type];
  canvas.toBlob(b=>{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=`${$("name").value||"can"}-${suffix}.${ext}`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  },type,0.92);
}
$("dl1").onclick=()=>save($("collage"),"collage");
$("dl2").onclick=()=>save($("card"),"card");
$("both").onclick=()=>{save($("card"),"card");setTimeout(()=>save($("collage"),"collage"),400)};
$("mar").onchange=render;

// ---- Load from a page link ----
function setStatus(t){$("status").textContent=t}

function goodThumbs(){return [...$("thumbs").children].filter(f=>f.classList.contains("ready")&&f.dataset.bad!=="1")}

function updateStatus(){
  const all=[...$("thumbs").children];
  const ready=all.filter(f=>f.classList.contains("ready")).length;
  const good=goodThumbs().length;
  if(ready===all.length&&ready>0&&good===0&&$("onlycan").checked){
    $("onlycan").checked=false;$("thumbs").classList.remove("only");
    setStatus(`No photos looked like cans, so all ${ready} images are shown. Pick the right ones manually.`);
    $("auto").disabled=true;return;
  }
  setStatus(ready===all.length?`Done: ${good} can-like photos, ${ready-good} filtered out.`:`Checking images… ${ready}/${all.length}`);
  $("auto").disabled=good===0;
}

function tagThumbs(){
  [...$("thumbs").children].forEach(f=>{
    const im=f.querySelector("img");
    f.querySelector(".tag").textContent=KEYS.filter(k=>imgs[k]&&imgs[k].src===im).map(k=>LABEL[k]).join(", ");
  });
}

function addThumb(url){
  const fig=document.createElement("figure");fig.className="th";
  const im=new Image();
  im.onload=()=>{
    const w=im.naturalWidth,h=im.naturalHeight,r=w/h;
    fig.dataset.bad=(Math.min(w,h)<150||r<.25||r>4||BADURL.test(url))?"1":"0";
    fig.querySelector(".dim").textContent=`${w}×${h}`;
    fig.classList.add("ready");updateStatus();
  };
  im.onerror=()=>{fig.remove();updateStatus()};
  im.src="/api/img?url="+encodeURIComponent(url);
  const meta=document.createElement("div");meta.className="meta";
  meta.innerHTML='<span class="dim"></span><span class="tag"></span>';
  const btns=document.createElement("div");btns.className="btns";
  KEYS.forEach(k=>{
    const b=document.createElement("button");b.textContent=LABEL[k];
    b.onclick=()=>setImage(k,im);btns.appendChild(b);
  });
  fig.append(im,meta,btns);$("thumbs").appendChild(fig);
}

$("scan").onclick=async()=>{
  const u=$("url").value.trim();if(!u)return;
  $("thumbs").innerHTML="";$("auto").disabled=true;
  setStatus("Searching the page…");
  try{
    const r=await fetch("/api/scan?url="+encodeURIComponent(u));
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||("status "+r.status));
    if(!j.images.length){setStatus("No images found on that page.");return}
    setStatus(`Found ${j.images.length} images, checking…`);
    j.images.forEach(addThumb);
  }catch(e){setStatus("Error: "+e.message)}
};
$("url").addEventListener("keydown",e=>{if(e.key==="Enter")$("scan").click()});
$("onlycan").onchange=e=>$("thumbs").classList.toggle("only",e.target.checked);
$("auto").onclick=()=>{
  goodThumbs().slice(0,4).forEach((f,i)=>setImage(KEYS[i],f.querySelector("img")));
};
render();
</script>
</body>
</html>
